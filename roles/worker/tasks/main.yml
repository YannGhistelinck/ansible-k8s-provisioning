---
# Worker node configuration
# Joins the worker to an existing Kubernetes cluster

- name: Check if node is already part of the cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf_status
  become: yes

- name: Join the Kubernetes cluster
  command: "{{ hostvars[groups['control_plane'][0]]['kubeadm_join_command'] }}"
  become: yes
  when: not kubelet_conf_status.stat.exists

- name: Wait for kubelet to register with the cluster
  pause:
    seconds: 10
  when: not kubelet_conf_status.stat.exists

- name: Display join status
  debug:
    msg: >-
      {{ 'Worker node joined the cluster successfully'
         if not kubelet_conf_status.stat.exists
         else 'Worker node is already part of the cluster, skipping join' }}
